name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          for u in https://www.besoccer.com/team/matches/tarancon https://www.besoccer.com/team/table/tarancon https://futbolme.com/resultados-directo/equipo/cd-tarancon/8904/calendario https://www.rfef.es; do
            echo "$u $(curl -s -o /dev/null -w '%{http_code}' -A "$UA" -H 'Accept-Language: es-ES,es;q=0.9' "$u")"
          done
